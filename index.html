<title>GovLayer · CAIO Workspace · A brand of IADM</title>
<meta name="description" content="GovLayer, the EU AI Act compliance learning workspace by IADM. Inventory, risk classification, gap analysis, bias check, training records, transparency notices and compliance reporting.">
<style>
:root{
  --navy:#212D68; --navy2:#2B3A85; --navy-deep:#18214D;
  --teal:#008DA9; --teal-bright:#1EB6CE; --teal-dark:#00708A;
  --ink:#262B38; --muted:#6B7280; --line:#D8DDEA;
  --bg:#F3F5FA; --card:#FFFFFF; --wash:#E9EEF6;
  --ok:#1E8E5A; --warn:#B7791F; --bad:#C0392B;
  --r:14px; --shadow:0 8px 28px rgba(33,45,104,.10);
  --disp:Cambria, Georgia, "Times New Roman", serif;
  --body:Calibri, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:15.5px;line-height:1.5}
button{font-family:var(--body);cursor:pointer}
input,select,textarea{font-family:var(--body);font-size:15px;color:var(--ink)}
a{color:var(--teal-dark)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:252px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- GovLayer own logo ---------- */
.gl-brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.gl-mark{width:40px;height:40px;flex-shrink:0}
.gl-name{font-family:var(--disp);font-size:21px;letter-spacing:.2px;line-height:1.1}
.gl-name b{font-weight:700}
.gl-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9FB4DE;margin-top:2px}

/* ---------- nav ---------- */
.nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
.nav-cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A97C6;padding:12px 10px 5px}
.nav a{display:flex;align-items:center;gap:10px;color:#D9E0F2;text-decoration:none;padding:8.5px 10px;border-radius:9px;font-size:14.5px;margin:1px 0}
.nav a svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:var(--teal);color:#fff;font-weight:600}
.nav .tag{margin-left:auto;font-size:9.5px;letter-spacing:.05em;background:rgba(255,255,255,.13);border-radius:99px;padding:2px 7px;color:#C6D2EF}
.nav a.on .tag{background:rgba(255,255,255,.22);color:#fff}

/* ---------- IADM footer in sidebar ---------- */
.iadm-foot{border-top:1px solid rgba(255,255,255,.14);padding:14px 16px 16px}
.iadm-foot .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8A97C6;margin-bottom:8px}
.iadm-foot img{width:132px;display:block;border-radius:6px}
.iadm-foot .cpd{font-size:11px;color:#AAB6DC;margin-top:8px;line-height:1.45}

/* ---------- topbar ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px}
.top h1{font-family:var(--disp);font-size:20px;color:var(--navy);font-weight:700}
.top .org{font-size:13px;color:var(--muted)}
.top .sp{flex:1}
.lang{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{border:0;background:#fff;padding:5px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--navy);color:#fff}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-dark);background:#E1F2F6;border-radius:99px;padding:4px 11px}

/* ---------- content ---------- */
.wrap{padding:24px 26px 60px;max-width:1180px;width:100%}
.crumb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dark);font-weight:700;margin-bottom:6px}
.h2{font-family:var(--disp);font-size:27px;color:var(--navy);margin-bottom:6px}
.lead{color:var(--muted);max-width:760px;margin-bottom:20px}
.curri{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--navy);background:var(--wash);border:1px solid var(--line);border-radius:99px;padding:4px 12px;margin-bottom:20px}
.curri b{color:var(--teal-dark)}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-family:var(--disp);font-size:17px;color:var(--navy);margin-bottom:10px}
.kpi{font-family:var(--disp);font-size:34px;color:var(--navy);line-height:1}
.kpi-l{font-size:12.5px;color:var(--muted);margin-top:6px}
.kpi-card{position:relative;overflow:hidden}
.kpi-card::after{content:"";position:absolute;right:-18px;bottom:-18px;width:66px;height:66px;border-radius:16px;background:var(--wash);transform:rotate(12deg)}
.mini{font-size:12.5px;color:var(--muted)}

.btn{border:0;border-radius:10px;padding:9px 16px;font-size:14.5px;font-weight:600}
.btn-p{background:var(--teal);color:#fff}
.btn-p:hover{background:var(--teal-dark)}
.btn-n{background:var(--navy);color:#fff}
.btn-g{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn-d{background:#fff;border:1.5px solid #E5B9B3;color:var(--bad)}
.btn-s{padding:5px 10px;font-size:12.5px;border-radius:8px}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:4px;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal-bright);border-color:var(--teal)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--wash);vertical-align:top}
tr:hover td{background:#FAFBFE}

.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;letter-spacing:.03em}
.b-proh{background:#F8E3E0;color:var(--bad)}
.b-high{background:#FBEDD7;color:#8C5A12}
.b-lim{background:#E1F2F6;color:var(--teal-dark)}
.b-min{background:#E2F2E9;color:var(--ok)}
.b-un{background:var(--wash);color:var(--muted)}
.b-ok{background:#E2F2E9;color:var(--ok)}
.b-open{background:#FBEDD7;color:#8C5A12}

.bar{height:9px;background:var(--wash);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-bright));border-radius:99px;transition:width .4s}

.note{border-left:4px solid var(--teal);background:#EFF7F9;border-radius:0 10px 10px 0;padding:11px 14px;font-size:13.5px;color:#204653;margin:14px 0}
.warnbox{border-left:4px solid var(--warn);background:#FDF6EA;border-radius:0 10px 10px 0;padding:11px 14px;font-size:13.5px;color:#6A4A14;margin:14px 0}

.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-family:var(--disp);font-size:18px;color:var(--navy);margin-bottom:5px}

.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--wash);font-size:14px}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--teal)}
.chk .art{margin-left:auto;flex-shrink:0;font-size:11px;font-weight:700;color:var(--teal-dark);background:#E1F2F6;border-radius:99px;padding:2px 8px}

.wiz-q{font-family:var(--disp);font-size:19px;color:var(--navy);margin:6px 0 12px}
.wiz-opts{display:grid;gap:9px}
.wiz-opts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14.5px}
.wiz-opts button:hover{border-color:var(--teal);background:#F4FBFC}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{height:5px;flex:1;background:var(--wash);border-radius:99px}
.steps i.on{background:var(--teal)}

.result-hero{border-radius:var(--r);padding:22px;color:#fff}
.rh-proh{background:linear-gradient(135deg,#8E2A20,var(--bad))}
.rh-high{background:linear-gradient(135deg,#7A4E0E,#B7791F)}
.rh-lim{background:linear-gradient(135deg,var(--teal-dark),var(--teal))}
.rh-min{background:linear-gradient(135deg,#166A43,var(--ok))}
.result-hero .rt{font-family:var(--disp);font-size:24px;margin-bottom:6px}

.disc{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:26px;padding-top:12px;max-width:860px}

/* print report */
.print-only{display:none}
@media print{
  .side,.top,.no-print{display:none!important}
  .print-only{display:block}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}
@media (max-width:1020px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .nav-cap{display:none}
  .g2,.g3,.g4,.frow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- access gate ---------- */
.gate{position:fixed;inset:0;z-index:999;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:34px 30px;max-width:420px;width:100%;text-align:center}
.gate-card .gl-mark{width:52px;height:52px;margin:0 auto 10px;display:block}
.gate-h{font-family:var(--disp);font-size:23px;color:var(--navy);margin-bottom:6px}
.gate-p{font-size:14px;color:var(--muted);margin-bottom:16px}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;text-align:center;letter-spacing:.12em;text-transform:uppercase}
.gate input:focus{outline:2px solid var(--teal-bright);border-color:var(--teal)}
.gate .btn{width:100%;margin-top:12px;padding:11px}
.gate-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.gate-foot{margin-top:16px;font-size:11.5px;color:var(--muted)}
.gate-foot img{height:30px;border-radius:5px;display:block;margin:8px auto 0}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <svg class="gl-mark" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 6 L42 15 L24 24 L6 15 Z" fill="#1EB6CE"/>
      <path d="M24 17 L42 26 L24 35 L6 26 Z" fill="#7FD0DE" opacity=".85"/>
      <path d="M24 28 L42 37 L24 46 L6 37 Z" fill="#212D68" opacity=".92"/>
      <path d="M40 2 L47 5.5 L40 9 Z" fill="#1EB6CE"/>
    </svg>
    <div class="gate-h">GovLayer</div>
    <p class="gate-p" id="gateP">Enter your access code from the IADM Certified AI Officer programme.</p>
    <input id="gateIn" autocomplete="off" placeholder="ACCESS CODE" onkeydown="if(event.key==='Enter')gateGo()">
    <button class="btn btn-p" onclick="gateGo()" id="gateBtn">Unlock</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-foot">A brand of IADM · CPD Member No. 021006<img id="gateLogo" alt="IADM"></div>
  </div>
</div>

<div class="app">

<aside class="side">
  <div class="gl-brand">
    <svg class="gl-mark" viewBox="0 0 48 48" aria-hidden="true">
      <!-- GovLayer mark: three stacked layers + teal play triangle echoing IADM -->
      <path d="M24 6 L42 15 L24 24 L6 15 Z" fill="#1EB6CE"/>
      <path d="M24 17 L42 26 L24 35 L6 26 Z" fill="#7FD0DE" opacity=".85"/>
      <path d="M24 28 L42 37 L24 46 L6 37 Z" fill="#FFFFFF" opacity=".92"/>
      <path d="M40 2 L47 5.5 L40 9 Z" fill="#1EB6CE"/>
    </svg>
    <div>
      <div class="gl-name"><b>Gov</b>Layer</div>
      <div class="gl-sub" data-i="tagline">AI Governance Workspace</div>
    </div>
  </div>

  <nav class="nav" id="nav"></nav>

  <div class="iadm-foot">
    <div class="lbl" data-i="brandof">A brand of IADM</div>
    <img id="iadmLogo" alt="IADM International Academy for Digitalization and Management">
    <div class="cpd">CPD accredited · Member No. 021006<br>www.iadm.academy</div>
  </div>
</aside>

<div class="main">
  <header class="top no-print">
    <h1 id="topTitle">Dashboard</h1>
    <span class="org" id="topOrg"></span>
    <span class="sp"></span>
    <img id="iadmTop" alt="IADM" style="height:34px;border-radius:6px">
    <span class="pill" data-i="learner">CAIO Learning Edition</span>
    <div class="lang">
      <button id="langEN" class="on" onclick="setLang('en')">EN</button>
      <button id="langDE" onclick="setLang('de')">DE</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>
</div>

/* access gate: code required once per browser */
function gateHash(s){let x=7;for(const c of s.toUpperCase().trim()){x=(x*31+c.charCodeAt(0))>>>0}return x.toString(36)}
const GATE_REF='ck72tp';
function gateGo(){
  const v=document.getElementById('gateIn').value;
  const de=(localStorage.getItem('gl_lang')||'en')==='de';
  if(gateHash(v)===GATE_REF){localStorage.setItem('gl_gate',GATE_REF);document.getElementById('gate').hidden=true;}
  else{document.getElementById('gateErr').textContent=de?'Code nicht erkannt. Den Code finden Sie in Section 12 des CAIO-Kurses.':'Code not recognised. You will find it in Section 12 of the CAIO course.';}
}
if(localStorage.getItem('gl_gate')!==GATE_REF){
  document.getElementById('gate').hidden=false;
  if((localStorage.getItem('gl_lang')||'en')==='de'){
    document.getElementById('gateP').textContent='Geben Sie Ihren Zugangscode aus dem IADM-Certified-AI-Officer-Programm ein.';
    document.getElementById('gateBtn').textContent='Freischalten';
  }
  setTimeout(()=>document.getElementById('gateIn').focus(),50);
}

function vRisk(){
  if(!S.systems.length) return `<div class="crumb">GovLayer · ${t('nav_risk')}</div><div class="h2">${t('nav_risk')}</div><div class="card empty"><div class="big">${t('no_sys')}</div><a class="btn btn-p" href="#inv" style="display:inline-block;margin-top:10px;text-decoration:none">${t('nav_inv')}</a></div>`;

  if(WIZ.res){
    const map={proh:['rh-proh','res_proh','res_proh_t'],high:['rh-high','res_high','res_high_t'],lim:['rh-lim','res_lim','res_lim_t'],min:['rh-min','res_min','res_min_t']}[WIZ.res];

      <button class="btn btn-g" onclick="WIZ.step=0;WIZ.res=null;render()">${t('again')}</button>

  } else {
    const q=WQ[LANG][WIZ.step];

  }
  return `
  <div class="crumb">GovLayer · ${t('nav_risk')}</div>
  <div class="h2">${t('nav_risk')}</div>

      <option value="" ${!WIZ.sys?'selected':''}>·</option>${sysOpts}</select></div>
    ${WIZ.sys? body : ''}
  </div>
  <div class="disc">${t('disclaimer')}</div>`;
}
function wAns(yes){
  if(WIZ.step===0){ if(yes){WIZ.res='proh'} else {WIZ.step=1} }
  else if(WIZ.step===1){ if(yes){WIZ.res='high'} else {WIZ.step=2} }
  else { WIZ.res = yes?'lim':'min'; }
  render();
}
function applyRisk(){
  const s=S.systems.find(x=>x.id===WIZ.sys); if(s){s.risk=WIZ.res; saveS();}
  WIZ.step=0; WIZ.res=null; location.hash='gap'; 
}

/* ---------- bias check ---------- */
const BIAS={rows:null,headers:null,result:null};
function parseCSV(txt){
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const split=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q}else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())};
  const h=split(lines[0]);
  return {headers:h, rows:lines.slice(1).map(split)};
}
function vBias(){
  let cols='', res='';
  if(BIAS.headers){
    const op=BIAS.headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('');
    cols=`<div class="frow">
      <div class="field"><label>${t('bias_group')}</label><select id="bG">${op}</select></div>
      <div class="field"><label>${t('bias_out')}</label><select id="bO">${op}</select></div></div>
      <div class="field"><label>${t('bias_pos')}</label><input id="bP" placeholder="e.g. hired / 1 / yes"></div>
      <button class="btn btn-p" onclick="runBias()">${t('bias_run')}</button>`;
  }
  if(BIAS.result){
    const r=BIAS.result;
    res=`<div class="card" style="margin-top:16px">
      <h3>${t('bias_res')}</h3>
      <table><thead><tr><th>Group</th><th>n</th><th>+</th><th>Rate</th></tr></thead><tbody>
      ${r.groups.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${g.n}</td><td>${g.pos}</td><td>${(g.rate*100).toFixed(1)}%</td></tr>`).join('')}
      </tbody></table>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px">
        <span class="mini">${t('bias_ratio')}</span>
        <span class="kpi" style="font-size:28px">${r.ratio.toFixed(2)}</span>
        <span class="badge ${r.ratio>=0.8?'b-ok':'b-proh'}">${r.ratio>=0.8?t('bias_pass'):t('bias_fail')}</span>
      </div>
      <div class="note">${t('bias_note')}</div>
    </div>`;
  }
  return `
  <div class="crumb">GovLayer · ${t('nav_bias')}</div>
  <div class="h2">${t('nav_bias')}</div>
  <p class="lead">${t('bias_lead')}</p>
  <div class="curri">CAIO <b>Section 5 · Bias and Fairness</b></div>
  <div class="card" style="max-width:720px">
    <div class="field"><label>${t('bias_file')}</label><input type="file" accept=".csv" onchange="loadCSV(this)"></div>
    ${cols}
  </div>
  ${res}
  <div class="disc">${t('disclaimer')}</div>`;
}
function loadCSV(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{ const p=parseCSV(e.target.result); BIAS.headers=p.headers; BIAS.rows=p.rows; BIAS.result=null; render(); };
  rd.readAsText(f);
}
function runBias(){
  const gi=+bG.value, oi=+bO.value, pos=bP.value.trim().toLowerCase();
  const m={};
  BIAS.rows.forEach(r=>{ const g=r[gi]||'(blank)'; m[g]=m[g]||{n:0,pos:0}; m[g].n++;
    if(String(r[oi]||'').trim().toLowerCase()===pos) m[g].pos++; });
  const groups=Object.entries(m).map(([name,v])=>({name,n:v.n,pos:v.pos,rate:v.n?v.pos/v.n:0}));
  const rates=groups.map(g=>g.rate).filter(r=>r>0);
  const ratio = rates.length? Math.min(...groups.map(g=>g.rate))/Math.max(...groups.map(g=>g.rate)||1) : 0;
  BIAS.result={groups,ratio: isFinite(ratio)?ratio:0}; render();
}

 deep:{en:sys=>`Notice: The following image, audio or video content has been artificially generated or manipulated (deepfake) using ${sys}. It does not depict real events. This disclosure is made in accordance with Article 50(4) of the EU AI Act.`,
